<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Macronaut — acompanhe seu plano alimentar, seus macros e seus treinos. PWA instalável."
    />
    <title>Macronaut</title>
    <script>
      // Aplica o tema antes da primeira pintura. Feito no React, o tema só
      // entrava depois do mount e a tela piscava escura antes de ficar clara.
      // Precisa ficar aqui, síncrono, sem `defer` nem `type=module`.
      (function () {
        try {
          var salvo = localStorage.getItem("macronaut-theme");
          var escuro =
            salvo === "dark" ||
            (salvo !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", escuro);
        } catch (e) {
          // localStorage bloqueado (modo privado em alguns navegadores):
          // o React aplica o tema no mount e a única perda é o piscar.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
